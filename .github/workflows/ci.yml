name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    name: Frontend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.6
      - run: ruff check .
      - run: ruff format --check .

  images:
    name: Docker images
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t genai-rag-backend:ci backend
      - run: docker build -t genai-rag-frontend:ci frontend
      - name: Images run as a non-root user
        run: |
          for image in genai-rag-backend:ci genai-rag-frontend:ci; do
            user=$(docker run --rm --entrypoint whoami "$image")
            echo "$image runs as $user"
            test "$user" != root
          done

  compose:
    name: Compose smoke test
    needs: [images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Check the success criteria
        run: bash scripts/smoke-test.sh
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  publish:
    name: Publish images
    needs: [compose]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # One publish at a time, so two pushes to main cannot race on the `latest` tag.
    concurrency:
      group: publish-images
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          # Only move `latest` if this commit is still the newest on main.
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          for service in backend frontend; do
            image="ghcr.io/${OWNER,,}/genai-rag-${service}"
            docker build -t "$image:$SHA" -t "$image:latest" "$service"
            docker push "$image:$SHA"
            if [ "$head" = "$SHA" ]; then
              docker push "$image:latest"
            else
              echo "main has moved on to $head: keeping the existing latest tag"
            fi
          done
