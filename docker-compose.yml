name: genai-rag-app

services:
  # The only service with a published port: every request enters through Nginx.
  nginx:
    image: nginx:1.31.10-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks: [app]

  frontend:
    build: ./frontend
    image: genai-rag-frontend:local
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [app]

  backend:
    build: ./backend
    image: genai-rag-backend:local
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      ROOT_PATH: /api
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    networks: [app]

  qdrant:
    image: qdrant/qdrant:v1.20.2
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The Qdrant image has no curl or wget, so open a TCP connection with bash instead.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [app]

volumes:
  qdrant_data:

networks:
  app:
    driver: bridge
