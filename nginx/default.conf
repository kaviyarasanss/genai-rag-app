# Docker's internal DNS. Re-resolving lets Nginx follow a container that Compose
# recreates with a new IP address, without restarting Nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend {
    zone backend 64k;
    server backend:8000 resolve;
}

upstream frontend {
    zone frontend 64k;
    server frontend:8501 resolve;
}

server {
    listen 80;

    # Backend accepts 10 MB files; leave room for multipart overhead.
    client_max_body_size 11m;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # Metrics are for Prometheus on the internal network only.
    location = /api/metrics {
        return 404;
    }

    # Grafana (monitoring profile). The upstream is a variable, so Nginx still starts
    # when Grafana is not running; requests then get 502 instead of Nginx failing.
    location /grafana/ {
        set $grafana http://grafana:3000;
        proxy_pass $grafana;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api/ask -> backend /ask (the trailing slash strips the /api prefix).
    location /api/ {
        proxy_pass http://backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Streamlit needs WebSocket upgrades for its live connection.
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }
}
